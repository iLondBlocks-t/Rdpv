name: Android Cloud RDP

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. Install Java 17
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 2. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 3. Install Linux Desktop and RDP
      - name: Install Desktop and RDP Server
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            x11-xserver-utils \
            iptables \
            netcat-openbsd

      # 4. Install Android 64-bit Emulator
      - name: Install Android Emulator
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

          echo "no" | avdmanager create avd \
            --force \
            --name CloudPhone \
            --device pixel_7_pro \
            --package "system-images;android-35;google_apis;x86_64"

      # 5. Connect Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 6. Configure RDP Account
      - name: Configure RDP Account
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ] || [ "${#RDP_PASSWORD}" -lt 12 ]; then
            echo "RDP_PASSWORD must contain at least 12 characters"
            exit 1
          fi

          USER_NAME=$(whoami)

          echo "$USER_NAME:$RDP_PASSWORD" | sudo chpasswd
          sudo usermod -aG ssl-cert "$USER_NAME"

          mkdir -p "$HOME/.config/autostart"

          cat > "$HOME/.xsession" <<'EOF'
          #!/bin/sh
          exec startxfce4
          EOF

          chmod +x "$HOME/.xsession"

      # 7. Configure Android Auto Start
      - name: Configure Android Auto Start
        run: |
          cat > "$HOME/start-android.sh" <<'EOF'
          #!/bin/bash

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          "$ANDROID_HOME/emulator/emulator" \
            -avd CloudPhone \
            -no-snapshot \
            -no-boot-anim \
            -no-audio \
            -gpu swiftshader_indirect \
            -accel off
          EOF

          chmod +x "$HOME/start-android.sh"

          printf '[Desktop Entry]\nType=Application\nName=Android Emulator\nExec=%s/start-android.sh\nX-GNOME-Autostart-enabled=true\n' "$HOME" \
            > "$HOME/.config/autostart/android.desktop"

      # 8. Start RDP
      - name: Start RDP Server
        run: |
          sudo iptables -I INPUT 1 \
            ! -i tailscale0 \
            -p tcp --dport 3389 \
            -j DROP

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          if ! nc -z 127.0.0.1 3389; then
            echo "RDP server failed!"
            sudo systemctl status xrdp --no-pager
            exit 1
          fi

          echo "RDP server is running!"

      # 9. Wait for Android Boot
      - name: Start Android Emulator
        run: |
          nohup "$HOME/start-android.sh" \
            > "$HOME/android.log" 2>&1 &

          for i in $(seq 1 90); do
            if adb devices | grep -q emulator; then
              break
            fi
            sleep 5
          done

          adb wait-for-device

          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "Android boot completed!"
              break
            fi
            sleep 5
          done

          adb shell getprop ro.build.version.release

      # 10. Print Connection Information
      - name: Print All Connection Details
        run: |
          IP=$(tailscale ip -4)
          USER_NAME=$(whoami)

          echo "================================"
          echo "       ANDROID CLOUD RDP"
          echo "================================"
          echo "Tailscale IPv4: $IP"
          echo "Port: 3389"
          echo "Username: $USER_NAME"
          echo "Password: GitHub Secret RDP_PASSWORD"
          echo "Android: Android 15 x86_64"
          echo "Desktop: XFCE"
          echo "================================"

          {
            echo "## Android Cloud RDP"
            echo "- Address: $IP"
            echo "- Port: 3389"
            echo "- Username: $USER_NAME"
            echo "- Password: GitHub Secret RDP_PASSWORD"
            echo "- Android: 15 x86_64"
          } >> "$GITHUB_STEP_SUMMARY"

      # 11. Keep Connection Alive
      - name: Keep Connection Alive
        run: |
          while true; do
            echo "Android RDP is running..."
            echo "Time: $(date)"
            sleep 300
          done

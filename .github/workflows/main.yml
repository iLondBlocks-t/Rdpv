name: macOS Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Run on macOS
    runs-on: macos-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show macOS information
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install Homebrew packages
        run: |
          brew update
          brew install wget jq

      - name: Run project build
        run: |
          echo "ضع أوامر بناء مشروعك هنا"
          echo "مثال:"
          echo "npm install"
          echo "npm run build"

      - name: Save build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            build/
            dist/
          if-no-files-found: ignore

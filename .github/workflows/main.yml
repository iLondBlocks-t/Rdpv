name: macOS SSH

on:
  workflow_dispatch:

permissions: {}

jobs:
  macos-ssh:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TALESCALE_AUTH_KEY }}
          log-mode: quiet

      - name: Enable Tailscale SSH
        shell: bash
        run: |
          sudo tailscale set --ssh
          runner_user="$(whoami)"
          runner_ip="$(tailscale ip -4)"
          echo "Runner user: ${runner_user}"
          echo "Tailscale IPv4: ${runner_ip}"
          echo "Connect with: tailscale ssh ${runner_user}@${runner_ip}"

      - name: Keep runner available
        shell: bash
        run: |
          echo "The macOS runner will stay available until cancelled or the 6-hour job limit is reached."
          while true; do
            sleep 300
          done

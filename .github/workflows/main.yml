
name: Android Cloud RDP

on:
  workflow_dispatch:

jobs:
  android-rdp:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. Java 17
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 2. Android SDK
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      # 3. Desktop and RDP
      - name: Install Desktop and RDP Server
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            x11vnc \
            xvfb \
            netcat-openbsd

      # 4. Create Android Emulator
      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name CloudPhone \
            --device pixel_7_pro \
            --package "system-images;android-35;google_apis;x86_64"

      # 5. Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 6. Configure RDP User
      - name: Configure RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ] || [ "${#RDP_PASSWORD}" -lt 12 ]; then
            echo "RDP_PASSWORD must be at least 12 characters"
            exit 1
          fi

          USER_NAME=$(whoami)

          echo "$USER_NAME:$RDP_PASSWORD" | sudo chpasswd
          sudo usermod -aG ssl-cert "$USER_NAME"

          mkdir -p "$HOME/.config"

          cat > "$HOME/.xsession" <<'EOF'
          #!/bin/sh
          exec startxfce4
          EOF

          chmod +x "$HOME/.xsession"

      # 7. Start Android Emulator
      - name: Start Android Emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd CloudPhone \
            -no-snapshot \
            -no-boot-anim \
            -no-audio \
            -gpu swiftshader_indirect \
            > "$HOME/android.log" 2>&1 &

          adb wait-for-device

          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Android started successfully!"
              break
            fi
            sleep 5
          done

          adb shell getprop ro.build.version.release

      # 8. Start RDP
      - name: Start RDP Server
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          if ! nc -z 127.0.0.1 3389; then
            sudo systemctl status xrdp --no-pager
            exit 1
          fi

          echo "RDP server is running!"

      # 9. Print Connection Details
      - name: Print Connection Information
        run: |
          IP=$(tailscale ip -4)
          USER_NAME=$(whoami)

          echo "================================"
          echo "ANDROID CLOUD RDP"
          echo "================================"
          echo "Address: $IP"
          echo "Port: 3389"
          echo "Username: $USER_NAME"
          echo "Password: GitHub Secret RDP_PASSWORD"
          echo "Android: Android 15 x86_64"
          echo "================================"

          {
            echo "## Android RDP Connection"
            echo "- Address: $IP"
            echo "- Port: 3389"
            echo "- Username: $USER_NAME"
            echo "- Password: GitHub Secret RDP_PASSWORD"
            echo "- Android: Android 15 x86_64"
          } >> "$GITHUB_STEP_SUMMARY"

      # 10. Keep Alive
      - name: Keep Connection Alive
        run: |
          while true; do
            echo "Android Cloud RDP is running"
            echo "Time: $(date)"
            sleep 300
          done
